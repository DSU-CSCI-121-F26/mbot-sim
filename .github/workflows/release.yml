# Publish a release to the Maven repo on GitHub Pages.
#
#   1. Set <version> in pom.xml (e.g. 0.1.1) and commit.
#   2. git tag v0.1.1 && git push origin v0.1.1
#
# This builds and tests the tag, then deploys the jar (and a sources jar, so IntelliJ can show
# the Javadoc) into the gh-pages branch under maven/. Pages serves it at
#   https://dsu-csci-121-f26.github.io/mbot-sim/maven
# A published version is never overwritten: labs pin exact versions and must not change under students.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: The tag must match the pom version
        run: |
          V=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but pom.xml says $V. Set <version>, commit, then tag."
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Check out the Maven repo (gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Refuse to overwrite a published version
        run: |
          if [ -d "pages/maven/edu/desu/cis/mbot-sim/$VERSION" ]; then
            echo "::error::$VERSION is already published. Bump the version instead."
            exit 1
          fi

      - name: Build, test, and deploy into the Maven repo
        run: mvn -B deploy -DaltDeploymentRepository=pages::file://$GITHUB_WORKSPACE/pages/maven

      - name: Publish
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish mbot-sim $VERSION"
          git push
